<!doctype html>
<html lang="zh-CN" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <title>Dreamcore Portfolio</title>

    <!-- 内联 SVG favicon：免得浏览器去请求 /favicon.ico 吃 404（薄荷绿圆角方块 + 一颗星） -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237ee8c7'/%3E%3Cpath d='M16 6l2.6 6.2L25 15l-6.4 2.8L16 24l-2.6-6.2L7 15l6.4-2.8z' fill='%233f9c7f'/%3E%3C/svg%3E"
    />
    <!-- 字体已全部自托管于 /fonts/（见 index.css），不再依赖 Google Fonts CDN -->

    <!-- ── 社交分享卡（微信 / 小红书 / X / LinkedIn / iMessage 都读这套）──────────
         og:image 用 1200×630 的横版卡片，正好是各平台推荐的 1.91:1。
         图源在 public/og/card-share-wide.png。
         ⚠️ og:image / og:url 填的是「相对路径」兜底：万一构建时没配 VITE_SITE_URL，
            爬虫会按页面地址自己补全，照样能显示；配了 VITE_SITE_URL 后（见 vite.config.ts
             的 shareCard()），构建时会自动改成绝对地址，Facebook / X 这类只认绝对地址的平台也稳。
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="孙晨茜 作品集" />
    <meta property="og:url" content="__OG_URL__" />
    <meta
      property="og:title"
      content="孙晨茜 作品集 · stay for a moment"
    />
    <meta
      property="og:description"
      content="观夏「隙月」夏季营销、神州租车新媒体代运营、赤尾品牌策划案 —— 品牌、内容策划与视觉作品集。进来坐一会儿吧。"
    />
    <meta property="og:image" content="og/card-share-wide.png" />
    <meta property="og:image:secure_url" content="og/card-share-wide.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="孙晨茜 作品集 · stay for a moment，横版分享卡"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="og/card-share-wide.png" />
    <meta name="theme-color" content="#7ee8c7" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
