<!doctype html>
<html lang="zh-CN" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <title>Dreamcore Portfolio</title>

    <!-- 内联 SVG favicon：免得浏览器去请求 /favicon.ico 吃 404（薄荷绿圆角方块 + 一颗星） -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237ee8c7'/%3E%3Cpath d='M16 6l2.6 6.2L25 15l-6.4 2.8L16 24l-2.6-6.2L7 15l6.4-2.8z' fill='%233f9c7f'/%3E%3C/svg%3E"
    />
    <!-- 字体已全部自托管于 /fonts/（见 index.css），不再依赖 Google Fonts CDN -->

    <!-- ── 社交分享卡（微信 / 小红书 / X / LinkedIn / iMessage 都读这套）──────────
         og:image 用 1200×630 的横版卡片，正好是各平台推荐的 1.91:1。
         图源在 public/og/card-share-wide.png。
         默认使用当前可访问的临时 Vercel 地址；配了 VITE_SITE_URL 后（见 vite.config.ts），
         构建时会自动替换为指定站点，备案完成后可直接切回正式域名。

         同目录下还有一张 **竖版** public/og/card-share-tall.png（1080×1440，3:4），
         它**不做 og:image**，是站内「联系方式 → 分享网站」那个浮层在窄屏上展示 /
         转发用的（横版塞进手机浮层只有一条扁条，竖版才看得清 come in）。
         两张图都由隔壁工作区 2026-09-26-20-09-02/_ogcard/ 里的脚本生成，
         那两份脚本是唯一出处，改图去那边改再拷回来。
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="孙晨茜 作品集" />
    <meta property="og:url" content="https://portfolio-ten-blush-61.vercel.app/" />
    <meta
      property="og:title"
      content="孙晨茜 作品集 · stay for a moment"
    />
    <meta
      property="og:description"
      content="观夏「隙月」夏季营销、神州租车新媒体代运营、赤尾品牌策划案 —— 品牌、内容策划与视觉作品集。进来坐一会儿吧。"
    />
    <meta property="og:image" content="https://portfolio-ten-blush-61.vercel.app/og/card-share-wide.png" />
    <meta property="og:image:secure_url" content="https://portfolio-ten-blush-61.vercel.app/og/card-share-wide.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="孙晨茜 作品集 · stay for a moment，横版分享卡"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://portfolio-ten-blush-61.vercel.app/og/card-share-wide.png" />
    <meta name="theme-color" content="#3b2b21" />
    <!-- 首屏防闪：CSS 包（含 body 的 bg-wine=#3b2b21）还没下载解析时，浏览器默认
         画白底 / 上面的 theme-color 薄荷绿，慢网（海外机房）下这层会先暴露好几秒，
         React 挂载后再跳成巧克力色 = 用户看到的「屏闪」。这里内联同款深色底，
         让 html/body 从 HTML 落地那一刻起就是站点色，前后零跳变。 -->
    <style>
      html, body {
        background-color: #3b2b21;
      }
    </style>

    <!-- ── 序列帧「首窗」预载 ────────────────────────────────────────────────
         进首页只需首窗序列帧就绪（见 App.tsx 的 READY_FRAMES）。这里在 <head>
         提前为首窗帧发起 preload ——
         它和 JS 主包**并行**开始下载，比等 React 起来、探测完 AVIF 再发要早
         0.3~0.8s（少一次「JS 下载+解析」的串行等待）。首张给 fetchpriority=high。

         ⚠️ `type="image/avif"` 不是可选项：不支持 AVIF 的浏览器会**自动跳过**
            这几条 preload（不浪费一个字节），随后由 App 的 supportsAvif() 探测
            落到 WebP 档正常加载。

         ⚠️ 尺寸档判据（frames / frames-sm）与 URL 拼法必须和 App.tsx 的
            FRAME_SIZE_DIR / buildFrameUrls **逐字一致**（含 ?v= 版本号），
            否则 preload 命不中 <img> 的缓存请求，反而白下 8 张。
            改 App.tsx 里那两处中的任何一处，都要同步改这里。
    -->
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        if (
          params.has('quick') ||
          params.has('choice') ||
          params.has('studio') ||
          params.has('about') ||
          params.has('greenos') ||
          params.has('crt')
        ) return;
        var vw = window.innerWidth;
        var canvasPx = vw * Math.min(window.devicePixelRatio || 1, 2);
        var shortSide = Math.min(window.innerWidth, window.innerHeight);
        var dir = shortSide <= 900 && canvasPx <= 2000 ? 'frames-sm-avif' : 'frames-avif';
        var VERSION = 2;
        var HEAD = 8;
        for (var i = 1; i <= HEAD; i++) {
          var link = document.createElement('link');
          link.rel = 'preload';
          link.as = 'image';
          link.type = 'image/avif';
          link.href = '/' + dir + '/' + String(i).padStart(4, '0') + '.avif?v=' + VERSION;
          if (i === 1) link.setAttribute('fetchpriority', 'high');
          document.head.appendChild(link);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
