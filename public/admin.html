<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>后台 · 留言与访客</title>
    <style>
      :root {
        --ink: #2b2b2b;
        --ink-soft: #6b6b6b;
        --line: #e6e0d4;
        --paper: #fbf9f4;
        --card: #ffffff;
        --accent: #b9772e;
        --accent-soft: #f6efe4;
        --red: #c2453b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 28px 18px 64px;
        background: var(--paper);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei",
          "Segoe UI", sans-serif;
        line-height: 1.7;
        -webkit-font-smoothing: antialiased;
      }
      .wrap { max-width: 860px; margin: 0 auto; }
      h1 { font-size: 21px; margin: 0 0 4px; letter-spacing: .02em; }
      .sub { color: var(--ink-soft); font-size: 13px; margin: 0 0 22px; }

      .gate {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 22px;
        margin-bottom: 22px;
      }
      .gate label { display: block; font-size: 13px; color: var(--ink-soft); margin-bottom: 6px; }
      .row { display: flex; gap: 10px; flex-wrap: wrap; }
      input[type="password"], input[type="text"] {
        flex: 1 1 240px;
        min-width: 0;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        font-size: 14px;
        background: #fff;
        color: var(--ink);
        font-family: inherit;
      }
      input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
      button {
        padding: 10px 16px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
        font-size: 14px;
        cursor: pointer;
        font-family: inherit;
      }
      button:hover { border-color: var(--accent); color: var(--accent); }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      button.primary:hover { filter: brightness(1.06); color: #fff; }
      button.danger { color: var(--red); border-color: #e8cdc9; }
      button:disabled { opacity: .5; cursor: not-allowed; }

      .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 22px; }
      .stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
      .stat .n { font-size: 28px; font-weight: 600; line-height: 1.2; font-variant-numeric: tabular-nums; }
      .stat .t { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }

      .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; margin-bottom: 14px; }
      .card .head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
      .card .who { font-weight: 600; }
      .card .meta { font-size: 12px; color: var(--ink-soft); }
      .card .mail { font-size: 12px; color: var(--accent); }
      .card .body { word-break: break-word; }
      .card .body img { max-width: 100%; }
      .card .body a { color: var(--accent); }

      .empty { color: var(--ink-soft); font-size: 14px; padding: 6px 2px; }
      .note { font-size: 12px; color: var(--ink-soft); margin-top: 12px; }
      .msg { font-size: 13px; padding: 10px 0; }
      .msg.err { color: var(--red); }
      .msg.ok { color: #2f7a4d; }
      hr { border: none; border-top: 1px solid var(--line); margin: 22px 0; }
      .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
      .spacer { flex: 1 1 auto; }

      /* ── 访问日志 ─────────────────────────────── */
      .log { display: flex; flex-direction: column; gap: 10px; }
      .log-row {
        background: var(--card);
        border: 1px solid var(--line);
        border-left: 3px solid var(--line);
        border-radius: 12px;
        padding: 12px 14px;
      }
      /* 带 ?from= 标记 = 你主动发出的链接被点开了，这是最该被看见的一条 */
      .log-row.is-tagged { border-left-color: var(--accent); background: #fffdf8; }
      /* 下载了简历 = 真在考虑你，独立高亮 */
      .log-row.is-hot { border-left-color: #2f7a4d; background: #f7fdf9; }
      .log-top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
      .log-when { font-weight: 600; font-variant-numeric: tabular-nums; }
      .log-geo { font-size: 12px; color: var(--ink-soft); }
      .log-dev { font-size: 12px; color: var(--ink-soft); }
      .log-sp { flex: 1 1 auto; }
      .log-dwell { font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
      .log-line { font-size: 13px; margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
      .log-k { color: var(--ink-soft); font-size: 12px; }
      .tag {
        display: inline-block; padding: 1px 8px; border-radius: 999px;
        background: var(--accent-soft); color: #8a5a1c; font-size: 12px; font-weight: 600;
      }
      .chip {
        display: inline-block; padding: 1px 7px; border-radius: 6px;
        background: #f2efe8; color: var(--ink-soft); font-size: 12px;
      }
      .chip.hot { background: #e3f5ea; color: #2f7a4d; font-weight: 600; }
      .log-new {
        font-size: 11px; font-weight: 700; color: #fff; background: var(--accent);
        padding: 1px 6px; border-radius: 999px; letter-spacing: .04em;
      }
      @media (max-width: 520px) {
        body { padding: 20px 14px 48px; }
        .stat .n { font-size: 24px; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>留言与访客</h1>
      <p class="sub">同一个页面里看留言内容、邮箱、访客数和浏览量。</p>

      <div id="gate" class="gate">
        <label for="key">后台口令（Vercel 环境变量里的 ADMIN_KEY）</label>
        <div class="row">
          <input id="key" type="password" placeholder="输入口令后回车" autocomplete="current-password" />
          <button id="login" class="primary">进去看</button>
        </div>
        <p class="msg err" id="gateMsg" hidden></p>
      </div>

      <div id="main" hidden>
        <div class="stats">
          <div class="stat"><div class="n" id="uv">–</div><div class="t">累计访客（去重）</div></div>
          <div class="stat"><div class="n" id="pv">–</div><div class="t">累计浏览量</div></div>
          <div class="stat"><div class="n" id="gbCount">–</div><div class="t">留言总数</div></div>
        </div>

        <div class="toolbar">
          <button id="refresh">刷新一下</button>
          <button id="testVisit">自己测一下访客数</button>
          <span class="spacer"></span>
          <button id="export">导出数据</button>
          <button id="clear" class="danger">清空留言</button>
        </div>
        <p class="msg" id="msg" hidden></p>

        <hr />

        <h1 style="font-size: 16px; margin-bottom: 6px;">访问日志</h1>
        <p class="sub" style="margin-bottom: 14px;">
          谁能看到这些：只有你（要口令）。记的是「有没有人来认真看过」——
          <b>带 ?from= 标记的那条</b>就是你发出去的链接被点开了。地区只到城市，
          完整 IP 不落库，日志 30 天自动过期。
        </p>
        <div class="toolbar" style="margin-bottom: 12px;">
          <button id="logOnlyTagged">只看带来源标记的</button>
          <button id="logExport">导出日志</button>
        </div>
        <div class="log" id="logList"></div>
        <p class="note" id="logNote"></p>

        <hr />

        <h1 style="font-size: 16px; margin-bottom: 12px;">全部留言</h1>
        <div id="list"></div>
        <p class="note">
          留言最多保留最近 500 条，新的在最上面。清空后不可恢复，先点「导出数据」留个备份。
        </p>
      </div>
    </div>

    <script>
      (function () {
        var $ = function (id) { return document.getElementById(id); };
        var keyInput = $('key');

        // 口令只存在 sessionStorage：关掉标签页就没了
        var saved = sessionStorage.getItem('dc.admin.key');
        if (saved) { keyInput.value = saved; }

        function setMsg(el, text, kind) {
          el.textContent = text || '';
          el.hidden = !text;
          el.className = 'msg' + (kind ? ' ' + kind : '');
        }

        function getKey() {
          var k = keyInput.value.trim();
          if (!k) { setMsg($('gateMsg'), '先填口令。', 'err'); return ''; }
          sessionStorage.setItem('dc.admin.key', k);
          return k;
        }

        // 和前台留言板同一套白名单，后台展示也先洗一遍
        var ALLOWED_TAGS = new Set(['B','STRONG','I','EM','U','S','STRIKE','SPAN','A','BR','DIV','P','FONT']);
        var DROPPED_TAGS = new Set(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','LINK','META','SVG','MATH','FORM','INPUT','TEXTAREA','BUTTON']);
        var ALLOWED_STYLE = new Set(['color','font-size','font-weight','font-style','text-decoration']);

        function sanitize(raw) {
          if (typeof DOMParser === 'undefined') return String(raw).replace(/[<>]/g, '');
          var doc = new DOMParser().parseFromString('<div>' + raw + '</div>', 'text/html');
          var root = doc.body.firstElementChild;
          if (!root) return '';
          (function walk(node) {
            Array.prototype.slice.call(node.children).forEach(function (child) {
              if (DROPPED_TAGS.has(child.tagName)) { child.remove(); return; }
              walk(child);
              if (!ALLOWED_TAGS.has(child.tagName)) {
                var frag = doc.createDocumentFragment();
                while (child.firstChild) frag.appendChild(child.firstChild);
                child.replaceWith(frag);
                return;
              }
              Array.prototype.slice.call(child.attributes).forEach(function (attr) {
                var name = attr.name.toLowerCase();
                if (name === 'href' && child.tagName === 'A') {
                  var url = attr.value.trim();
                  if (/^(https?:|mailto:|\/)/i.test(url)) {
                    child.setAttribute('href', url);
                    child.setAttribute('target', '_blank');
                    child.setAttribute('rel', 'noopener noreferrer');
                  } else { child.removeAttribute('href'); }
                  return;
                }
                if (name === 'style') {
                  var keep = attr.value.split(';').map(function (d) {
                    var i = d.indexOf(':');
                    var k = (i < 0 ? '' : d.slice(0, i)).trim().toLowerCase();
                    return ALLOWED_STYLE.has(k) ? d.trim() : '';
                  }).filter(Boolean).join('; ');
                  if (keep) child.setAttribute('style', keep); else child.removeAttribute('style');
                  return;
                }
                child.removeAttribute(attr.name);
              });
            });
          })(root);
          return root.innerHTML;
        }

        function timeText(ts) {
          if (!ts) return '';
          var d = new Date(ts);
          var p = function (n) { return n < 10 ? '0' + n : '' + n; };
          return d.getFullYear() + '.' + p(d.getMonth() + 1) + '.' + p(d.getDate()) + ' ' +
                 p(d.getHours()) + ':' + p(d.getMinutes());
        }

        var currentData = null;
        var currentLogs = [];
        var onlyTagged = false;

        /* ---------------- 访问日志 ---------------- */

        /** 栏目 id → 中文名，后台列表里直接给人看 */
        var SECTION_LABEL = {
          intro: '自我介绍',
          vision: '职业愿景',
          inspiration: '灵感收藏',
          guestbook: '留言板',
          home: '首页',
          studio: '工作室'
        };

        function secLabel(id) { return SECTION_LABEL[id] || id; }

        function dwellText(sec) {
          if (!sec || sec < 1) return '不到 1 秒';
          if (sec < 60) return sec + ' 秒';
          var m = Math.floor(sec / 60);
          var s = sec % 60;
          return s ? (m + ' 分 ' + s + ' 秒') : (m + ' 分钟');
        }

        function relText(ts) {
          var d = Date.now() - ts;
          if (d < 60000) return '刚刚';
          if (d < 3600000) return Math.floor(d / 60000) + ' 分钟前';
          if (d < 86400000) return Math.floor(d / 3600000) + ' 小时前';
          return Math.floor(d / 86400000) + ' 天前';
        }

        function renderLogs() {
          var logs = onlyTagged ? currentLogs.filter(function (l) { return l.from; }) : currentLogs;
          var list = $('logList');
          $('logNote').textContent = '共 ' + currentLogs.length + ' 条记录' +
            (onlyTagged ? '（筛出带来源标记的 ' + logs.length + ' 条）' : '') +
            ' · 最新在前 · 30 天自动清理';

          if (!logs.length) {
            list.innerHTML = '<p class="empty">' +
              (onlyTagged ? '还没有带来源标记的访问。' : '还没有访问记录。') + '</p>';
            return;
          }

          list.innerHTML = logs.map(function (l) {
            var hot = (l.events || []).indexOf('简历下载') >= 0;
            var cls = 'log-row' + (l.from ? ' is-tagged' : '') + (hot ? ' is-hot' : '');
            var parts = [];

            parts.push('<div class="log-top">');
            parts.push('<span class="log-when">' + timeText(l.ts) + '</span>');
            parts.push('<span class="log-geo">' + (l.geo ? escapeHtml(l.geo) : '地区未知') + '</span>');
            parts.push('<span class="log-dev">' + (l.device === 'mobile' ? '手机' :
              l.device === 'tablet' ? '平板' : '电脑') +
              (l.ua ? ' · ' + escapeHtml(l.ua) : '') + '</span>');
            parts.push('<span class="log-sp"></span>');
            parts.push('<span class="log-dwell">停留 ' + dwellText(l.dwell) + '</span>');
            parts.push('<span class="log-geo">' + relText(l.last || l.ts) + '</span>');
            parts.push('</div>');

            // 来源：这是全页面最重要的一行
            if (l.from) {
              parts.push('<div class="log-line"><span class="log-k">来源</span>' +
                '<span class="tag">' + escapeHtml(l.from) + '</span></div>');
            } else if (l.ref) {
              parts.push('<div class="log-line"><span class="log-k">来路</span>' +
                '<span class="chip">' + escapeHtml(l.ref) + '</span></div>');
            } else {
              parts.push('<div class="log-line"><span class="log-k">来源</span>' +
                '<span class="chip">直接打开（未带标记）</span></div>');
            }

            // 看了哪些栏
            var secs = (l.sections || []).map(function (s) {
              return '<span class="chip">' + escapeHtml(secLabel(s)) + '</span>';
            }).join(' ');
            parts.push('<div class="log-line"><span class="log-k">看了</span>' +
              (secs || '<span class="chip">—</span>') + '</div>');

            // 关键动作
            if (hot) {
              parts.push('<div class="log-line"><span class="log-k">动作</span>' +
                '<span class="chip hot">★ 下载了简历</span></div>');
            }

            return '<div class="' + cls + '">' + parts.join('') + '</div>';
          }).join('');
        }

        function loadLogs() {
          var key = keyInput.value.trim();
          if (!key) return;
          fetch('/api/visitlog', { headers: { 'x-admin-key': key }, cache: 'no-store' })
            .then(function (r) { return r.json().then(function (j) { return { status: r.status, data: j }; }); })
            .then(function (out) {
              if (!out.data || out.data.ok !== true) {
                $('logList').innerHTML = '<p class="empty">读不到访问日志：' +
                  escapeHtml(String(out.data && out.data.reason || out.status)) + '</p>';
                return;
              }
              currentLogs = out.data.logs || [];
              renderLogs();
            })
            .catch(function (e) {
              $('logList').innerHTML = '<p class="empty">网络错误：' + escapeHtml(e.message) + '</p>';
            });
        }

        $('logOnlyTagged').addEventListener('click', function () {
          onlyTagged = !onlyTagged;
          this.textContent = onlyTagged ? '显示全部' : '只看带来源标记的';
          renderLogs();
        });

        $('logExport').addEventListener('click', function () {
          var payload = {
            exportedAt: new Date().toISOString(),
            total: currentLogs.length,
            logs: currentLogs
          };
          var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
          var a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'dreamcore-visitlog-' + timeText(Date.now()).replace(/[ .:]/g, '-') + '.json';
          a.click();
          URL.revokeObjectURL(a.href);
        });

        function render(data) {
          currentData = data;
          $('uv').textContent = data.uv;
          $('pv').textContent = data.pv;
          $('gbCount').textContent = data.guestbook.length;
          var list = $('list');
          if (!data.guestbook.length) {
            list.innerHTML = '<p class="empty">还没有留言。</p>';
            return;
          }
          list.innerHTML = data.guestbook.map(function (e) {
            var mail = e.email ? ' · <span class="mail">' + escapeHtml(e.email) + '</span>' : '';
            return '<div class="card">' +
              '<div class="head"><span class="who">' + escapeHtml(e.name || '匿名') + '</span>' +
              '<span class="meta">' + timeText(e.ts) + '</span>' + mail + '</div>' +
              '<div class="body">' + sanitize(e.html) + '</div></div>';
          }).join('');
        }

        function escapeHtml(s) {
          return String(s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
          });
        }

        function load() {
          var key = keyInput.value.trim();
          if (!key) return;
          $('refresh').disabled = true;
          // 口令只放请求头：放网址里会被浏览器历史 / 日志记下来
          fetch('/api/admin', { headers: { 'x-admin-key': key }, cache: 'no-store' })
            .then(function (r) {
              return r.json().then(function (j) { return { status: r.status, data: j }; });
            })
            .then(function (out) {
              if (out.status === 401) {
                sessionStorage.removeItem('dc.admin.key');
                setMsg($('gateMsg'), '口令不对。', 'err');
                $('main').hidden = true;
                return;
              }
              if (out.status === 503) {
                setMsg($('gateMsg'), '服务端还没配好：' + (out.data.reason || '') + '（要配 ADMIN_KEY 和存储）', 'err');
                return;
              }
              if (!out.data || out.data.ok !== true) {
                setMsg($('gateMsg'), '读不出来：' + (out.data && out.data.reason || out.status), 'err');
                return;
              }
              $('gate').hidden = true;
              $('main').hidden = false;
              render(out.data);
              loadLogs(); // 留言 + 访客数拿到后，再把访问日志并进来
            })
            .catch(function (e) { setMsg($('gateMsg'), '网络错误：' + e.message, 'err'); })
            .finally(function () { $('refresh').disabled = false; });
        }

        // 「自己测一下访客数」：直接打网站的统计接口，看数字有没有涨
        $('testVisit').addEventListener('click', function () {
          var btn = this;
          btn.disabled = true;
          fetch('/api/visit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ unique: true }),
          })
            .then(function (r) { return r.json(); })
            .then(function (j) {
              setMsg($('msg'), '刚记了一次：你是第 ' + j.count + ' 位访客，累计浏览量 ' + j.pv + '。', 'ok');
              setTimeout(load, 600);
            })
            .catch(function (e) { setMsg($('msg'), '测试失败：' + e.message, 'err'); })
            .finally(function () { btn.disabled = false; });
        });

        $('login').addEventListener('click', function () { if (getKey()) load(); });
        keyInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') { if (getKey()) load(); } });
        // 「刷新一下」把留言数和访问日志一起刷新，不用点两次
        $('refresh').addEventListener('click', function () { load(); loadLogs(); });

        $('export').addEventListener('click', function () {
          var payload = {
            exportedAt: new Date().toISOString(),
            uv: $('uv').textContent,
            pv: $('pv').textContent,
            guestbook: currentData ? currentData.guestbook : [],
          };
          var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
          var a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'dreamcore-guestbook-' + timeText(Date.now()).replace(/[ .:]/g, '-') + '.json';
          a.click();
          URL.revokeObjectURL(a.href);
        });

        $('clear').addEventListener('click', function () {
          var key = keyInput.value.trim();
          if (!window.confirm('清空全部留言？这一步不能撤销。')) return;
          var btn = this;
          btn.disabled = true;
          fetch('/api/guestbook', {
            method: 'DELETE',
            headers: { 'x-admin-key': key },
          })
            .then(function (r) { return r.json(); })
            .then(function (j) { setMsg($('msg'), j.ok ? '已清空。' : ('失败：' + (j.reason || '')), j.ok ? 'ok' : 'err'); load(); })
            .catch(function (e) { setMsg($('msg'), '失败：' + e.message, 'err'); })
            .finally(function () { btn.disabled = false; });
        });

        if (saved) load();
      })();
    </script>
  </body>
</html>
